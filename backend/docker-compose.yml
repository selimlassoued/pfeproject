services:
  keycloak-db:
    image: postgres:16
    container_name: keycloak-db
    networks:
      - ai-recruitment-network
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=${KEYCLOAK_DB_USER}
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak -d keycloak" ]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.4
    container_name: keycloak
    ports:
      - "8090:8080"
    networks:
      - ai-recruitment-network
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_HEALTH_ENABLED=true

      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=${KEYCLOAK_DB_USER}
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}

      - KC_HOSTNAME=localhost
      - KC_HOSTNAME_PORT=8090
      - KC_HOSTNAME_STRICT=false
      - KC_PROXY=edge
      - KC_HTTP_ENABLED=true

      - KC_MAIL_ENABLED=true
      - KC_MAIL_HOST=${KC_MAIL_HOST}
      - KC_MAIL_PORT=${KC_MAIL_PORT}
      - KC_MAIL_FROM=${KC_MAIL_FROM}
      - KC_MAIL_USER=${KC_MAIL_USER}
      - KC_MAIL_PASSWORD=${KC_MAIL_PASSWORD}
      - KC_MAIL_AUTH=${KC_MAIL_AUTH}
      - KC_MAIL_STARTTLS=${KC_MAIL_STARTTLS}
    command: start-dev --import-realm --log-level=DEBUG
    volumes:
      - ./hireAI:/opt/keycloak/themes
      - ./keycloak-export:/opt/keycloak/data/import
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

#  mailhog:
#    image: mailhog/mailhog:latest
#    container_name: mailhog
#    profiles: ["dev"]
#    ports:
#      - "1025:1025"
#      - "8025:8025"
#    networks:
#      - ai-recruitment-network
#    healthcheck:
#      test: [ "CMD-SHELL", "nc -z 127.0.0.1 1025 || exit 1" ]
#      interval: 10s
#      timeout: 5s
#      retries: 10


  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ai-recruitment-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  eureka-server:
    build: ./eurekaserver
    container_name: eureka-server
    networks:
      - ai-recruitment-network
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8761/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  config-server:
    build: ./configserver
    container_name: config-server
    ports:
      - "9999:9999"
    networks:
      - ai-recruitment-network
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    healthcheck:
      # 30s timeout because the config-server health endpoint can take up to
      # 18s when GitHub is slow from this network (default health indicator
      # pings the Git backend). Also bumped start_period for the slow first
      # boot. Application.yml now disables the slow indicator so probes
      # respond instantly in normal conditions; this is a safety net.
      test: ["CMD-SHELL", "curl --fail --silent --max-time 25 http://localhost:9999/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 60s
    depends_on:
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    build: ./gatewayserver
    container_name: gateway
    ports:
      - "8888:8888"
    networks:
      - ai-recruitment-network
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      - DISCOVERY_SERVICE_URL=http://eureka-server:8761/eureka
      - CONFIG_SERVICE_URL=http://config-server:9999
      - KEYCLOAK_URL=http://keycloak:8080
      - KC_BACKEND_CLIENT_SECRET=${KC_BACKEND_CLIENT_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8888/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      eureka-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      config-server:
        condition: service_healthy

  job-db:
    # pgvector image = stock postgres:16 + the `vector` extension preinstalled.
    # Needed so we can persist 768-dim Ollama embeddings on JobOffer rows and
    # avoid recomputing them every time a candidate applies. The init script
    # runs `CREATE EXTENSION vector` on first boot.
    image: pgvector/pgvector:pg16
    container_name: job-db
    networks:
      - ai-recruitment-network
    environment:
      - POSTGRES_DB=jobdb
      - POSTGRES_USER=${JOB_DB_USER}
      - POSTGRES_PASSWORD=${JOB_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - job_pgdata:/var/lib/postgresql/data
      - ./job-db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U jobuser -d jobdb" ]
      interval: 10s
      timeout: 5s
      retries: 10

  job-microservice:
    build: ./job-microservice
    container_name: job-microservice
    networks:
      - ai-recruitment-network
    ports:
      - "8082:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://job-db:5432/jobdb
      - SPRING_DATASOURCE_USERNAME=${JOB_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${JOB_DB_PASSWORD}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      job-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  cv-parser-service:
    build: ./cv-parser-service
    container_name: cv-parser-service
    networks:
      - ai-recruitment-network
    ports:
      - "8085:8085"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # ← pour accéder à Ollama sur Windows
    environment:
      - APP_PORT=8085
      - OLLAMA_HOST=http://host.docker.internal:11434
      - SEMANTIC_MATCH_EMBED_MODEL=nomic-embed-text
      # Used by semantic_matcher._get_or_compute_job_vector to read/write the
      # cached pgvector embedding on the JobOffer row.
      - JOB_SERVICE_URL=http://job-microservice:8080
      - SEMANTIC_MATCH_ANALYSIS_MODEL=qwen2.5:7b
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      # Persistent skill-intelligence cache (framework→stack + volatility,
      # LLM-classified once per skill). Lives in a volume so it survives rebuilds.
      - SKILL_INTEL_CACHE=/data/skill_intel_cache.json
    volumes:
      - skill_intel_data:/data
  application-db:
    # pgvector image = stock postgres:16 + the `vector` extension preinstalled.
    # Needed so the skill_catalog_entry table can store the 768-dim embedding
    # used for typo dedup and (eventually) similar-skill queries.
    image: pgvector/pgvector:pg16
    container_name: application-db
    networks:
      - ai-recruitment-network
    environment:
      - POSTGRES_DB=appdb
      - POSTGRES_USER=${APP_DB_USER}
      - POSTGRES_PASSWORD=${APP_DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - app_pgdata:/var/lib/postgresql/data
      - ./application-db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U appuser -d appdb" ]
      interval: 10s
      timeout: 5s
      retries: 10

  application-microservice:
    build: ./application-microservice
    container_name: application-microservice
    networks:
      - ai-recruitment-network
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://application-db:5432/appdb
      - SPRING_DATASOURCE_USERNAME=${APP_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${APP_DB_PASSWORD}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      application-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      cv-parser-service: # ← ajoute ça
        condition: service_started

  audit-db:
    image: postgres:16
    container_name: audit-db
    networks:
      - ai-recruitment-network
    environment:
      - POSTGRES_DB=auditdb
      - POSTGRES_USER=${AUDIT_DB_USER}
      - POSTGRES_PASSWORD=${AUDIT_DB_PASSWORD}
    volumes:
      - audit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U audituser -d auditdb" ]
      interval: 10s
      timeout: 5s
      retries: 10

  audit-service:
    build: ./audit-service
    container_name: audit-service
    networks:
      - ai-recruitment-network
    environment:
      - CONFIG_SERVICE_URL=http://config-server:9999
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      audit-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  notification-db:
    image: postgres:16
    container_name: notification-db
    networks:
      - ai-recruitment-network
    environment:
      - POSTGRES_DB=notificationdb
      - POSTGRES_USER=${NOTIFICATION_DB_USER}
      - POSTGRES_PASSWORD=${NOTIFICATION_DB_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - notification_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U notificationuser -d notificationdb" ]
      interval: 10s
      timeout: 5s
      retries: 10
  interview-db:
    image: postgres:16
    container_name: interview-db
    networks:
      - ai-recruitment-network
    environment:
      - POSTGRES_DB=interviewdb
      - POSTGRES_USER=${INTERVIEW_DB_USER}
      - POSTGRES_PASSWORD=${INTERVIEW_DB_PASSWORD}
    ports:
      - "5437:5432"
    volumes:
      - interview_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U interviewuser -d interviewdb" ]
      interval: 10s
      timeout: 5s
      retries: 10

  interview-service:
    build: ./interview-service
    container_name: interview-service
    networks:
      - ai-recruitment-network
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://interview-db:5432/interviewdb
      - SPRING_DATASOURCE_USERNAME=${INTERVIEW_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${INTERVIEW_DB_PASSWORD}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - CONFIG_SERVICE_URL=http://config-server:9999
      - RABBITMQ_HOST=rabbitmq
      - RECORDINGS_DIR=/recordings
      - SPRING_RECORDINGS_DIR=/recordings
      - ANALYSIS_SIDECAR_URL=http://analysis-service:8000
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - APPLICATION_SERVICE_URL=http://application-microservice:8080
      - JOB_SERVICE_URL=http://job-microservice:8080
    depends_on:
      interview-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - recordings:/recordings

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

    networks:
      - ai-recruitment-network

  analysis-service:
    build:
      context: ./analysis-service
      args:
        # Fallback model is baked into the image (kept small).
        # Primary model downloads lazily on first start and is cached in the
        # whisper_cache volume below, so this only happens once.
        WHISPER_FALLBACK_MODEL: medium
    container_name: analysis-service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Default is medium. Measured on real interview audio it preserved
      # technical proper nouns (Java, ArrayList) more reliably than large-v3,
      # while running about 2x faster on CPU and using far less RAM, which
      # avoids the 30 min HTTP timeout we hit when both Whisper and the LLM
      # competed for resources. Override via .env only after benchmarking
      # against a real recording.
      - WHISPER_MODEL=${WHISPER_MODEL:-medium}
      - WHISPER_FALLBACK_MODEL=medium
      - WHISPER_LANGUAGE=en
      - OLLAMA_BASE=http://ollama:11434
      # qwen2.5:7b — used for both transcript re-attribution and the
      # interview evaluation. More accurate than 3b, noticeably slower on CPU.
      - OLLAMA_MODEL=qwen2.5:7b
      - RECORDINGS_DIR=/recordings
    volumes:
      - recordings:/recordings       # shared with interview-service
      - whisper_cache:/root/.cache/whisper   # persists downloaded models
    depends_on:
      - ollama
    networks:
      - ai-recruitment-network

  notification-microservice:
    build: ./notification-microservice
    container_name: notification-microservice
    networks:
      - ai-recruitment-network
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://notification-db:5432/notificationdb
      - SPRING_DATASOURCE_USERNAME=${NOTIFICATION_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${NOTIFICATION_DB_PASSWORD}
      - CONFIG_SERVICE_URL=http://config-server:9999
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - MAIL_HOST=${KC_MAIL_HOST}
      - MAIL_PORT=${KC_MAIL_PORT}
      - MAIL_USER=${KC_MAIL_USER}
      - MAIL_PASSWORD=${KC_MAIL_PASSWORD}
      - MAIL_AUTH=${KC_MAIL_AUTH}
      - MAIL_STARTTLS=${KC_MAIL_STARTTLS}
      - APP_SECURITY_KEYCLOAK_TOKEN_URL=http://keycloak:8080/realms/ai-recruitment/protocol/openid-connect/token
      - APP_SECURITY_KEYCLOAK_CLIENT_ID=${BACKEND_CLIENT_ID}
      - APP_SECURITY_KEYCLOAK_CLIENT_SECRET=${KC_BACKEND_CLIENT_SECRET}

    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

networks:
  ai-recruitment-network:
    driver: bridge

volumes:
  keycloak_pgdata:
  job_pgdata:
  app_pgdata:
  audit_pgdata:
  notification_pgdata:
  interview_pgdata:
  recordings:
  ollama_data:
  whisper_cache:
  skill_intel_data:        # persistent LLM skill-classification cache (cv-parser-service)
