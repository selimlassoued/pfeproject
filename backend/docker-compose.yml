services:
  keycloak-db:
    image: postgres:16
    container_name: keycloak-db
    networks:
      - ai-recruitment-network
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak -d keycloak" ]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.4
    container_name: keycloak
    ports:
      - "8090:8080"
    networks:
      - ai-recruitment-network
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true

      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak

      - KC_HOSTNAME=localhost
      - KC_HOSTNAME_PORT=8090
      - KC_HOSTNAME_STRICT=false
      - KC_PROXY=edge
      - KC_HTTP_ENABLED=true

      - KC_MAIL_ENABLED=true
      - KC_MAIL_HOST=${KC_MAIL_HOST}
      - KC_MAIL_PORT=${KC_MAIL_PORT}
      - KC_MAIL_FROM=${KC_MAIL_FROM}
      - KC_MAIL_USER=${KC_MAIL_USER}
      - KC_MAIL_PASSWORD=${KC_MAIL_PASSWORD}
      - KC_MAIL_AUTH=${KC_MAIL_AUTH}
      - KC_MAIL_STARTTLS=${KC_MAIL_STARTTLS}
    command: start-dev --import-realm --log-level=DEBUG
    volumes:
      - ./hireAI:/opt/keycloak/themes
      - ./keycloak-export:/opt/keycloak/data/import
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

#  mailhog:
#    image: mailhog/mailhog:latest
#    container_name: mailhog
#    profiles: ["dev"]
#    ports:
#      - "1025:1025"
#      - "8025:8025"
#    networks:
#      - ai-recruitment-network
#    healthcheck:
#      test: [ "CMD-SHELL", "nc -z 127.0.0.1 1025 || exit 1" ]
#      interval: 10s
#      timeout: 5s
#      retries: 10


  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ai-recruitment-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  eureka-server:
    build: ./eurekaserver
    container_name: eureka-server
    networks:
      - ai-recruitment-network
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8761/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  config-server:
    build: ./configserver
    container_name: config-server
    ports:
      - "9999:9999"
    networks:
      - ai-recruitment-network
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9999/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    build: ./gatewayserver
    container_name: gateway
    ports:
      - "8888:8888"
    networks:
      - ai-recruitment-network
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      - DISCOVERY_SERVICE_URL=http://eureka-server:8761/eureka
      - CONFIG_SERVICE_URL=http://config-server:9999
      - KEYCLOAK_URL=http://keycloak:8080
      - KC_BACKEND_CLIENT_SECRET=${KC_BACKEND_CLIENT_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8888/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      eureka-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      config-server:
        condition: service_healthy

  job-db:
    image: postgres:16
    container_name: job-db
    networks:
      - ai-recruitment-network
    environment:
      - POSTGRES_DB=jobdb
      - POSTGRES_USER=jobuser
      - POSTGRES_PASSWORD=jobpass
    ports:
      - "5434:5432"
    volumes:
      - job_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U jobuser -d jobdb" ]
      interval: 10s
      timeout: 5s
      retries: 10

  job-microservice:
    build: ./job-microservice
    container_name: job-microservice
    networks:
      - ai-recruitment-network
    ports:
      - "8082:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://job-db:5432/jobdb
      - SPRING_DATASOURCE_USERNAME=jobuser
      - SPRING_DATASOURCE_PASSWORD=jobpass
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      job-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  cv-parser-service:
    build: ./cv-parser-service
    container_name: cv-parser-service
    networks:
      - ai-recruitment-network
    ports:
      - "8085:8085"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # ← pour accéder à Ollama sur Windows
    environment:
      - APP_PORT=8085
      - OLLAMA_HOST=http://host.docker.internal:11434
      - SEMANTIC_MATCH_EMBED_MODEL=nomic-embed-text
      - SEMANTIC_MATCH_ANALYSIS_MODEL=qwen2.5:7b
      - GITHUB_TOKEN=${GITHUB_TOKEN}
  application-db:
    image: postgres:16
    container_name: application-db
    networks:
      - ai-recruitment-network
    environment:
      - POSTGRES_DB=appdb
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=apppass
    ports:
      - "5435:5432"
    volumes:
      - app_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U appuser -d appdb" ]
      interval: 10s
      timeout: 5s
      retries: 10

  application-microservice:
    build: ./application-microservice
    container_name: application-microservice
    networks:
      - ai-recruitment-network
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://application-db:5432/appdb
      - SPRING_DATASOURCE_USERNAME=appuser
      - SPRING_DATASOURCE_PASSWORD=apppass
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      application-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      cv-parser-service: # ← ajoute ça
        condition: service_started

  audit-db:
    image: postgres:16
    container_name: audit-db
    networks:
      - ai-recruitment-network
    environment:
      - POSTGRES_DB=auditdb
      - POSTGRES_USER=audituser
      - POSTGRES_PASSWORD=auditpass
    volumes:
      - audit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U audituser -d auditdb" ]
      interval: 10s
      timeout: 5s
      retries: 10

  audit-service:
    build: ./audit-service
    container_name: audit-service
    networks:
      - ai-recruitment-network
    environment:
      - CONFIG_SERVICE_URL=http://config-server:9999
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      audit-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  notification-db:
    image: postgres:16
    container_name: notification-db
    networks:
      - ai-recruitment-network
    environment:
      - POSTGRES_DB=notificationdb
      - POSTGRES_USER=notificationuser
      - POSTGRES_PASSWORD=notificationpass
    ports:
      - "5436:5432"
    volumes:
      - notification_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U notificationuser -d notificationdb" ]
      interval: 10s
      timeout: 5s
      retries: 10
  interview-db:
    image: postgres:16
    container_name: interview-db
    networks:
      - ai-recruitment-network
    environment:
      - POSTGRES_DB=interviewdb
      - POSTGRES_USER=interviewuser
      - POSTGRES_PASSWORD=interviewpass
    ports:
      - "5437:5432"
    volumes:
      - interview_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U interviewuser -d interviewdb" ]
      interval: 10s
      timeout: 5s
      retries: 10

  interview-service:
    build: ./interview-service
    container_name: interview-service
    networks:
      - ai-recruitment-network
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://interview-db:5432/interviewdb
      - SPRING_DATASOURCE_USERNAME=interviewuser
      - SPRING_DATASOURCE_PASSWORD=interviewpass
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - CONFIG_SERVICE_URL=http://config-server:9999
      - RABBITMQ_HOST=rabbitmq
      - RECORDINGS_DIR=/recordings
      - SPRING_RECORDINGS_DIR=/recordings
      - ANALYSIS_SIDECAR_URL=http://analysis-service:8000
    depends_on:
      interview-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - recordings:/recordings

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

    networks:
      - ai-recruitment-network

  analysis-service:
    build:
      context: ./analysis-service
      args:
        WHISPER_MODEL: small
    container_name: analysis-service
    restart: unless-stopped
    environment:
      - WHISPER_MODEL=small
      - OLLAMA_BASE=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:3b
      - RECORDINGS_DIR=/recordings
    volumes:
      - recordings:/recordings       # shared with interview-service
    depends_on:
      - ollama
    networks:
      - ai-recruitment-network

  notification-microservice:
    build: ./notification-microservice
    container_name: notification-microservice
    networks:
      - ai-recruitment-network
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://notification-db:5432/notificationdb
      - SPRING_DATASOURCE_USERNAME=notificationuser
      - SPRING_DATASOURCE_PASSWORD=notificationpass
      - CONFIG_SERVICE_URL=http://config-server:9999
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - MAIL_HOST=${KC_MAIL_HOST}
      - MAIL_PORT=${KC_MAIL_PORT}
      - MAIL_USER=${KC_MAIL_USER}
      - MAIL_PASSWORD=${KC_MAIL_PASSWORD}
      - MAIL_AUTH=${KC_MAIL_AUTH}
      - MAIL_STARTTLS=${KC_MAIL_STARTTLS}
      - APP_SECURITY_KEYCLOAK_TOKEN_URL=http://keycloak:8080/realms/ai-recruitment/protocol/openid-connect/token
      - APP_SECURITY_KEYCLOAK_CLIENT_ID=${BACKEND_CLIENT_ID}
      - APP_SECURITY_KEYCLOAK_CLIENT_SECRET=${KC_BACKEND_CLIENT_SECRET}

    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

networks:
  ai-recruitment-network:
    driver: bridge

volumes:
  keycloak_pgdata:
  job_pgdata:
  app_pgdata:
  audit_pgdata:
  notification_pgdata:
  interview_pgdata:
  recordings:
  ollama_data:
