spring:
  rabbitmq:
    host: "rabbitmq"
    port: 5672
    username: "guest"
    password: "guest"
  application:
    name: "configserver"
  profiles:
    active: git
  #    active: native
  cloud:
    config:
      server:
        git:
          uri: https://github.com/selimlassoued/hireAI-config-repo.git
          default-label: main
          clone-on-start: true
          force-pull: true

server:
  port: 9999
management:
  endpoints:
    web:
      exposure:
        include: '*'

# Disable the Spring Cloud Config server health indicator. It pings the Git
# backend on every probe, which is slow (10-18s) when GitHub is throttled
# from VERMEG's network. With this off, /actuator/health responds instantly
# and the compose healthcheck stops timing out.
spring.cloud.config.server.health.enabled: false