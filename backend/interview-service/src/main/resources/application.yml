server:
  port: ${SERVER_PORT:8086}
  error:
    include-message: always

recordings:
  dir: ${RECORDINGS_DIR:recordings}

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
  application:
    name: interview-service
  cloud:
    discovery:
      enabled: true
  config:
    import: optional:configserver:${CONFIG_SERVICE_URL:http://config-server:9999}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/interviewdb}
    username: ${SPRING_DATASOURCE_USERNAME:interviewuser}
    password: ${SPRING_DATASOURCE_PASSWORD:interviewpass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka
  instance:
    prefer-ip-address: true

analysis:
  sidecar:
    url: ${ANALYSIS_SIDECAR_URL:http://analysis-service:8000}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:4200/google-callback}

app:
  messaging:
    exchange: ${APP_MESSAGING_EXCHANGE:app.events}

application:
  service:
    url: ${APPLICATION_SERVICE_URL:http://application-microservice:8081}

job:
  service:
    url: ${JOB_SERVICE_URL:http://job-microservice:8080}
management:
  endpoints:
    web:
      exposure:
        include: "mappings,health"
user:
  service:
    url: http://gateway:8888   # or http://user-service:8083 if calling directly
