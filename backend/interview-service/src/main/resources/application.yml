server:
  # Port is left at the Spring Boot default (8080), same as every other
  # service. Eureka registers (name, host, 8080) on startup so the gateway
  # finds us via lb://interview-service without any hardcoded port.
  error:
    include-message: always

recordings:
  dir: ${RECORDINGS_DIR:recordings}    # interview-specific path

spring:
  application:
    name: interview-service     # required so Spring knows which remote file to fetch
  cloud:
    discovery:
      enabled: true
  config:
    import: optional:configserver:${CONFIG_SERVICE_URL:http://config-server:9999}
  servlet:
    multipart:
      # 50 MB is comfortably more than any real interview audio chunk
      # (typically 5-20 MB at the codec we use) while keeping a single
      # malicious request from filling the recordings disk. Used to be
      # 500 MB which was an easy DoS vector.
      max-file-size: 50MB
      max-request-size: 50MB