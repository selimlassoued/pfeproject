<div class="schedule-interview-card">

  <div class="schedule-header">
    <h3 class="schedule-title">Schedule Interview</h3>
    <p class="schedule-subtitle">Pick a day, then choose an available time slot.</p>
  </div>

  <div class="schedule-form">

    <!-- Day -->
    <div class="form-block">
      <label class="form-label" for="si-date">Day</label>
      <input id="si-date" type="date" class="form-input"
             [min]="minDate"
             [(ngModel)]="selectedDate"
             (ngModelChange)="onDateChange()" />
    </div>

    <!-- Time slots -->
    <div class="form-block">
      <label class="form-label">Time slot</label>

      @if (busyLoading) {
        <div class="si-slots-msg">Loading availability…</div>
      } @else {
        <div class="si-slots">
          @for (slot of slots; track slot.time) {
            <button type="button"
                    class="si-slot"
                    [class.si-slot--free]="slot.state === 'free'"
                    [class.si-slot--past]="slot.state === 'past'"
                    [class.si-slot--recruiter]="slot.state === 'recruiter'"
                    [class.si-slot--candidate]="slot.state === 'candidate'"
                    [class.si-slot--both]="slot.state === 'both'"
                    [class.si-slot--on]="selectedSlot === slot.time"
                    [disabled]="slot.state !== 'free'"
                    [title]="slotTitle(slot)"
                    (click)="pickSlot(slot)">
              {{ slot.time }}
            </button>
          }
        </div>

        <div class="si-legend">
          <span class="si-legend-item"><i class="si-dot si-dot--free"></i> Available</span>
          <span class="si-legend-item"><i class="si-dot si-dot--recruiter"></i> You're busy</span>
          <span class="si-legend-item"><i class="si-dot si-dot--candidate"></i> Candidate busy</span>
          <span class="si-legend-item"><i class="si-dot si-dot--past"></i> Past</span>
        </div>
      }
    </div>

    <!-- Error -->
    @if (error) {
      <div class="form-error-box">{{ error }}</div>
    }

    <!-- Actions -->
    <div class="form-actions">
      <button type="button"
              class="btn btn-primary schedule-btn"
              [disabled]="!selectedSlot || loading"
              (click)="submit()">
        {{ loading ? 'Scheduling…' : 'Schedule Interview' }}
      </button>
    </div>

  </div>
</div>
